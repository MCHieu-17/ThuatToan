[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evrp-realtime-lab"
version = "0.1.0"
description = "Montoya EVRP: Greedy + charging DP versus GA + VNS"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.65,<2", "plotly>=5.24,<7", "pandas>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
evrp = "evrp.cli:main"

[tool.setuptools.packages.find]
include = ["evrp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
