[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evrp-realtime"
version = "0.1.0"
description = "EVRP realtime Montoya: Greedy+DP, GA, GA-VNS with TOU and nonlinear charging"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
report = ["matplotlib>=3.7"]
dev = ["pytest>=8"]

[project.scripts]
evrp = "evrp.cli:main"

[tool.setuptools.packages.find]
include = ["evrp*"]

[tool.pytest.ini_options]
testpaths = ["tests", "web/tests"]
pythonpath = ["."]